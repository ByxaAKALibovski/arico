<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket</title>
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/ui.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <a href="index.html" class="logo">название</a>
                <nav class="nav">
                    <a href="catalog.html" class="nav__link">Каталог</a>
                    <a href="promo.html" class="nav__link">Акции</a>
                    <a href="about.html" class="nav__link">О нас</a>
                </nav>
                <a href="profile.html" class="profile">
                    <img src="assets/media/icons/profile.svg" alt="Профиль">
                </a>
            </div>
        </div>
    </header>
    <main class="main">
        <section class="basket">
            <div class="container">
                <h1 class="basket__title">Корзина</h1>
                <div class="basket__items">
                    <div class="basket__item">
                        <div class="basket__item-image">
                            <img src="assets/media/temp/product.png" alt="Продукт">
                        </div>
                        <div class="basket__item-info">
                            <h3 class="basket__item-title">Название продукта</h3>
                            <p class="basket__item-price">1000 ₽</p>
                            <div class="basket__item-quantity">
                                <button class="basket__item-quantity-btn">-</button>
                                <input type="number" value="1" min="1" class="basket__item-quantity-input">
                                <button class="basket__item-quantity-btn">+</button>
                            </div>
                        </div>
                        <button class="basket__item-remove">
                            <img src="assets/media/icons/trash.svg" alt="Удалить">
                        </button>
                    </div>
                    <div class="basket__item">
                        <div class="basket__item-image">
                            <img src="assets/media/temp/product.png" alt="Продукт">
                        </div>
                        <div class="basket__item-info">
                            <h3 class="basket__item-title">Название продукта</h3>
                            <p class="basket__item-price">1000 ₽</p>
                            <div class="basket__item-quantity">
                                <button class="basket__item-quantity-btn">-</button>
                                <input type="number" value="1" min="1" class="basket__item-quantity-input">
                                <button class="basket__item-quantity-btn">+</button>
                            </div>
                        </div>
                        <button class="basket__item-remove">
                            <img src="assets/media/icons/trash.svg" alt="Удалить">
                        </button>
                    </div>
                    
                </div>
                <div class="basket__total">
                    <p class="basket__total-text">Итого:</p>
                    <p class="basket__total-price">2000 ₽</p>
                </div>
                <button class="basket__checkout-btn">Оформить заказ</button>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <div class="footer__inner">
                <p class="footer__copy">© 2023</p>
            </div>
        </div>
    </footer>
    <script src="assets/js/main.js"></script>
</body>
</html>
