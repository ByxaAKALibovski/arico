<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket</title>
    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/ui.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header second__header">
        <div class="container">
            <a href="index.html" class="logo__header">
                <h1>ARICO</h1>
            </a>
            <nav class="header__nav">
                <a href="catalog.html">Catalog</a>
                <a href="about.html">About us</a>
                <a href="promo.html">Promo</a>
            </nav>
            <a href="profile.html" class="profile__link">
                <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="17" cy="10.2" rx="6.8" ry="6.8" fill="#1C1814" />
                    <path d="M27.2 34H6.8C6.8 26.18 17 23.8 17 23.8C17 23.8 27.2 26.18 27.2 34Z" fill="#1C1814" />
                    <circle cx="17" cy="17" r="16" stroke="#1C1814" stroke-width="2" />
                </svg>


            </div>

    </header>
    <main class="main">
        <section class="basket">
            <div class="container">
                <h1 class="basket__title">Корзина</h1>
                <div class="basket__items">
                    <div class="basket__item">
                        <div class="basket__item-image">
                            <img src="assets/media/temp/product.png" alt="Продукт">
                        </div>
                        <div class="basket__item-info">
                            <h3 class="basket__item-title">Название продукта</h3>
                            <p class="basket__item-price">1000 ₽</p>
                            <div class="basket__item-quantity">
                                <button class="basket__item-quantity-btn">-</button>
                                <input type="number" value="1" min="1" class="basket__item-quantity-input">
                                <button class="basket__item-quantity-btn">+</button>
                            </div>
                        </div>
                        <button class="basket__item-remove">
                            <img src="assets/media/icons/trash.svg" alt="Удалить">
                        </button>
                    </div>
                    <div class="basket__item">
                        <div class="basket__item-image">
                            <img src="assets/media/temp/product.png" alt="Продукт">
                        </div>
                        <div class="basket__item-info">
                            <h3 class="basket__item-title">Название продукта</h3>
                            <p class="basket__item-price">1000 ₽</p>
                            <div class="basket__item-quantity">
                                <button class="basket__item-quantity-btn">-</button>
                                <input type="number" value="1" min="1" class="basket__item-quantity-input">
                                <button class="basket__item-quantity-btn">+</button>
                            </div>
                        </div>
                        <button class="basket__item-remove">
                            <img src="assets/media/icons/trash.svg" alt="Удалить">
                        </button>
                    </div>
                    
                </div>
                <div class="basket__total">
                    <p class="basket__total-text">Итого:</p>
                    <p class="basket__total-price">2000 ₽</p>
                </div>
                <button class="basket__checkout-btn">Оформить заказ</button>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <nav class="footer__nav">
                <a href="#">Catalog</a>
                <a href="#">About us</a>
                <a href="#">Promo</a>
            </nav>
            <div class="contact__block">
                <p>Contact Us</p>
                <p>+7(999)999-99-99</p>
            </div>



        </div>

    </footer>
    <script src="assets/js/main.js"></script>
</body>
</html>
